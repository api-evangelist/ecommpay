note: ECOMMPAY unifies all operation response, decline, and error codes into a single registry surfaced to merchants in the
  callback/response operation.code and operation.message parameters (and in Dashboard). The list below is the full unified
  code reference (378 codes) covering both soft/hard declines and API-level errors. Code 0 = success; 100-604 = declines/processing
  outcomes; 2xxx-3xxx = request validation and data errors. This file serves as both the DeclineCodes and the ErrorCatalog
  for ECOMMPAY.
envelope:
  status_field: operation.status
  code_field: operation.code
  message_field: operation.message
  statuses:
  - success
  - awaiting 3ds result
  - awaiting redirect result
  - awaiting clarification
  - awaiting customer action
  - awaiting merchant auth
  - processing
  - decline
  - error
masked_to_buyers: Decline reasons are surfaced to the merchant via operation.code/message; customer-facing wording is generalised.
  Some risk-control (RCS) declines return code 402 with 'No action required' and no detailed buyer reason.
