name: ECOMMPAY
kind: company
description: >-
  ECOMMPAY is a London-headquartered international payment service provider and
  direct card acquirer founded in 2012, authorised by the UK Financial Conduct
  Authority (FRN 607597), PCI DSS Level 1 certified, and holding Visa and
  Mastercard Principal Membership. It operates its own payment gateway,
  acquiring, and certified processing platform, serving e-commerce merchants
  across Europe, the UK, and global markets with card processing, 100+
  alternative and local payment methods, open banking, payouts, multi-currency
  settlement, and fraud prevention. Its developer surface is API-native but
  signature-authenticated rather than token-based: merchants integrate through a
  hosted Payment Page API, a server-to-server Gate API for direct payment
  processing, a Data API for reporting and reconciliation, and a Dashboard for
  operational management, all documented on a public developer portal with
  callbacks/webhooks and multi-language SDKs. Its home market is the United
  Kingdom.
