apis:
- aid: ecommpay:ecommpay-payment-page-api
  name: ECOMMPAY Payment Page API
  description: >-
    Hosted, highly customisable payment form for accepting payments across
    cards, alternative payment methods, and wallets. Merchants open the Payment
    Page with a signed request (HMAC signature over the request parameters using
    the project secret key) and receive asynchronous callbacks with the payment
    result. Includes JavaScript and mobile SDKs.
  humanURL: https://developers.ecommpay.com/en/en_PP_about.html
  baseURL: https://paymentpage.ecommpay.com
  tags:
  - Payments
  - Hosted Payment Page
  - Checkout
  properties:
  - type: Documentation
    url: https://developers.ecommpay.com/en/en_PP_about.html
  - type: APIReference
    url: https://developers.ecommpay.com/en/en_PP_API.html
- aid: ecommpay:ecommpay-gate-api
  name: ECOMMPAY Gate API
  description: >-
    Server-to-server payment API for direct integration, giving merchants full
    control of the payment flow through their own interface. Supports one-time
    purchases, refunds, payouts, and credential-on-file transactions. Requests
    are authenticated with a project ID and an HMAC signature over the request
    payload; payment results are delivered via asynchronous callbacks. The API
    reference is rendered on a dedicated Stoplight-based reference host.
  humanURL: https://developers.ecommpay.com/en/en_Gate_Integration_About.html
  baseURL: https://api.ecommpay.com/v2
  tags:
  - Payments
  - Payouts
  - Refunds
  - Server to Server
  properties:
  - type: Documentation
    url: https://developers.ecommpay.com/en/en_Gate_Integration_About.html
  - type: APIReference
    url: https://api-developers.ecommpay.com/api.html
- aid: ecommpay:ecommpay-data-api
  name: ECOMMPAY Data API
  description: >-
    Reporting and data-retrieval API for programmatic access to payment,
    operation, and reconciliation data on the ECOMMPAY platform. Requests are
    accepted over HTTP/1.1+ with TLS 1.2+ at the documented endpoints and are
    signature-authenticated. The interface specification is published on a
    dedicated Stoplight-based reference host.
  humanURL: https://developers.ecommpay.com/en/en_dbl_api_overview.html
  baseURL: https://data.ecommpay.com/v1
  tags:
  - Data
  - Reporting
  - Reconciliation
  properties:
  - type: Documentation
    url: https://developers.ecommpay.com/en/en_dbl_api_overview.html
  - type: APIReference
    url: https://api-data.ecommpay.com/api.html
- aid: ecommpay:ecommpay-dashboard
  name: ECOMMPAY Dashboard
  description: >-
    Merchant management interface providing tools for controlling, analysing,
    and managing payments, projects, and reporting across the ECOMMPAY platform.
  humanURL: https://developers.ecommpay.com/en/en_dbl_about.html
  tags:
  - Dashboard
  - Management
  - Reporting
  properties:
  - type: Documentation
    url: https://developers.ecommpay.com/en/en_dbl_about.html
