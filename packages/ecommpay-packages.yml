note: >-
  Official first-party client libraries are published under the ITECOMMPAY GitHub
  organisation. The core set is the Payment Page SDK family (one per language) that
  builds and signs the Payment Page open request; there is a parallel Gate/mobile SDK
  set and a suite of first-party e-commerce platform plugins. These are
  request-signing / integration libraries (there is no downloadable OpenAPI to
  generate from). Distribution is primarily via GitHub / language package managers
  (Composer, npm, PyPI, Maven, Go modules, CocoaPods/SPM, NuGet).
