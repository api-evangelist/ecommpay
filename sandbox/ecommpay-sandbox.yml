  quickstart: https://developers.ecommpay.com/en/en_gate_quickstart.html
note: >-
  ECOMMPAY separates test from production via test projects (a merchant is issued a
  dedicated test project_id + secret key). Test payments run through the platform
  exactly like production - they are registered, appear in the Dashboard, and payment
  instrument details are processed - but no actual debiting takes place. The processing
  scenario (success vs decline, 3-D Secure challenge vs frictionless) is selected by the
  test card number; amount, cardholder name, and CVV can take arbitrary but well-formed
  values (expiry cannot predate the payment date).
mode:
  selection: card-number-driven
  environment: test projects (separate project_id/secret from live)
  debiting: none (no real funds move)
